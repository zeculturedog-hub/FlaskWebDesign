{% extends "base.html" %}

{% block title %}Register - ExpenseFlow{% endblock %}

{% block content %}
<section class="auth-layout">
    <div>
        <p class="eyebrow">Get started</p>
        <h1>Create your expense account.</h1>
        <p>Use this project to practice forms, sessions, password hashing, and database inserts.</p>
    </div>

    <form class="form-card" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>

        <button class="button primary full" type="submit">Create account</button>
        <p class="form-link">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
</section>
{% endblock %}
